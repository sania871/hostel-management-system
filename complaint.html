<!DOCTYPE html>
<html>
<head>
<title>Complaint Management</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
}

.container{
width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

input, textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0059b3;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#003366;
}

</style>

</head>

<body>

<div class="container">

<h2>Complaint Management</h2>

<label>Student Name</label>
<input type="text" placeholder="Enter your name">

<label>Complaint</label>
<textarea rows="5" placeholder="Write your complaint here"></textarea>

<button>Submit Complaint</button>

</div>

</body>
</html>
